<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Active Exam Interface</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/accessibility.css" />
    <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="app-bg app-fullscreen exam-body">
    <!-- Compact Timer Bar with Navigation -->
    <div class="exam-timer-bar">
        <!-- Navigation Arrows on Left -->
        <div class="header-nav-left">
            <button class="header-nav-btn-compact" data-nav-prev disabled>
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <div class="header-nav-info-compact">
                <span data-nav-current>1</span>/<span data-nav-total>50</span>
            </div>
            <button class="header-nav-btn-compact" data-nav-next>
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

        <div class="exam-meta">
            <div class="exam-meta-title" id="examTitleHeader">Active Exam</div>
            <div class="exam-meta-sub" id="examCodeHeader">Exam ID: --</div>
        </div>

        <div class="exam-timer">
            <span class="material-symbols-outlined exam-timer-icon">schedule</span>
            <span class="app-mono fw-semibold" data-timer-container>
                <span data-timer>02:00:00</span>
            </span>
        </div>

        <div class="exam-actions">
            <span class="app-mono small" data-progress-text>0/50</span>
            <button class="btn btn-dark btn-sm" data-submit-exam>Submit</button>
        </div>
    </div>

    <main class="container-fluid exam-main" data-exam-scroll>
        <div class="exam-content-full">
            <!-- MCQ Panel -->
            <div class="question-card p-4 mb-3" data-mcq-container>
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge text-bg-dark" data-question-badge>Question 1</span>
                        <span class="badge text-bg-light border" data-section-badge>General</span>
                    </div>
                    <button class="btn btn-outline-dark btn-sm" onclick="showInstructions()">
                        Instructions
                    </button>
                </div>
                <h2 class="app-title" data-question-text>Loading question...</h2>
                <div class="mt-2 text-muted small" data-question-subtext></div>
                <div class="mt-4 d-flex flex-column gap-3" data-mcq-panel>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">A</span>
                            <span data-option-text>Option A</span>
                        </label>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">B</span>
                            <span data-option-text>Option B</span>
                        </label>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">C</span>
                            <span data-option-text>Option C</span>
                        </label>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">D</span>
                            <span data-option-text>Option D</span>
                        </label>
                </div>
            </div>
            
            <!-- Coding Panel - LeetCode Style Split Layout -->
            <div class="coding-split-container d-none" data-coding-container>
                <div class="coding-left-panel">
                    <div class="p-4">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <span class="badge text-bg-dark" data-coding-question-badge>Question 1</span>
                            <button class="btn btn-outline-dark btn-sm" onclick="showInstructions()">
                                Instructions
                            </button>
                        </div>
                        <h3 class="fw-bold mb-3" data-coding-question-text>Coding Problem</h3>
                        <div class="mb-3">
                            <div class="fw-semibold mb-2">Problem</div>
                            <p class="mb-2" data-coding-prompt></p>
                        </div>
                        <div class="mb-3">
                            <div class="fw-semibold mb-2">Constraints</div>
                            <div class="small text-muted" data-coding-constraints></div>
                        </div>
                        <div class="mb-3">
                            <div class="fw-semibold mb-2">Examples</div>
                            <div class="small" data-coding-examples></div>
                        </div>
                    </div>
                </div>
                <div class="coding-right-panel">
                    <div class="coding-editor-header">
                        <label class="fw-semibold">Code</label>
                        <select class="form-select form-select-sm select-compact" id="codeLanguage" aria-label="Code language">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>
                    <label class="visually-hidden" for="codeEditor">Code editor</label>
                    <textarea class="form-control app-mono code-editor" id="codeEditor" rows="10" placeholder="Write your solution here..."></textarea>
                    <div class="coding-actions">
                        <button class="btn btn-outline-dark" id="runCode">▶ Run</button>
                        <button class="btn btn-dark" id="submitCode">Submit</button>
                    </div>
                    <div class="coding-output">
                        <div class="fw-semibold mb-2">Output</div>
                        <pre class="mb-0 app-mono" id="codeOutput">Ready.</pre>
                    </div>
                </div>
            </div>
            
            <!-- Bottom Navigation -->
            <div class="exam-navigation">
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-outline-dark" data-prev-question>← Previous</button>
                    <button class="btn btn-outline-dark" data-flag>🚩 Flag</button>
                    <button class="btn btn-dark" data-next-question>Next →</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/exam.js"></script>
</body>
</html>
