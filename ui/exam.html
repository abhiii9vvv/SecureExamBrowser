<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Active Exam Interface</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/accessibility.css" />
    <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="app-bg app-fullscreen">
    <header class="app-header">
        <div class="container-fluid py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="status-icon is-ok">
                    <span class="material-symbols-outlined">verified_user</span>
                </div>
                <div>
                    <div class="app-title">Sharda University</div>
                    <div class="app-subtitle">B.Tech - Data Structures & Algorithms</div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="app-mono small">Time Remaining</div>
                <div class="app-mono fs-5 fw-semibold" data-timer-container>
                    <span data-timer>02:00:00</span>
                </div>
                <div class="d-none d-lg-flex align-items-center gap-2">
                    <div class="small text-muted">Progress</div>
                    <div class="app-mono small" data-progress-text>3/50 (6%)</div>
                    <div class="progress" style="width: 140px; height: 6px;">
                        <div class="progress-bar bg-dark" role="progressbar" data-progress-bar style="width: 6%"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid app-main app-compact" data-exam-scroll>
        <div class="row g-4">
            <aside class="col-lg-3">
                <div class="app-card p-3 mb-3">
                    <div class="app-section-title mb-2">Question Navigator</div>
                    <div class="question-grid" data-question-grid></div>
                </div>
                <div class="app-card p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="status-icon">
                            <span class="material-symbols-outlined">videocam</span>
                        </div>
                        <div>
                            <div class="fw-semibold">Live Proctoring</div>
                            <div class="text-muted small">Camera feed active</div>
                        </div>
                    </div>
                    <div class="proctoring-frame compact mt-3" style="aspect-ratio: 4 / 3;">
                        <video id="proctoring-video" autoplay playsinline></video>
                        <canvas id="proctoring-canvas"></canvas>
                        <div class="proctoring-status" id="proctoring-status">Initializing camera...</div>
                    </div>
                </div>
            </aside>

            <section class="col-lg-9">
                <div class="question-card p-4 mb-3">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge text-bg-dark" data-question-badge>Question 1</span>
                            <span class="badge text-bg-light border" data-section-badge>General</span>
                        </div>
                        <button class="btn btn-outline-dark btn-sm" onclick="showInstructions()">
                            Instructions
                        </button>
                    </div>
                    <h2 class="app-title" data-question-text>Loading question...</h2>
                    <div class="mt-2 text-muted small" data-question-subtext></div>
                    <div class="mt-4 d-flex flex-column gap-3" data-mcq-panel>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">A</span>
                            <span data-option-text>Option A</span>
                        </label>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">B</span>
                            <span data-option-text>Option B</span>
                        </label>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">C</span>
                            <span data-option-text>Option C</span>
                        </label>
                        <label class="option-card d-flex align-items-center" data-option-label>
                            <input class="form-check-input me-2" type="radio" name="answer" />
                            <span class="option-indicator">D</span>
                            <span data-option-text>Option D</span>
                        </label>
                    </div>
                    <div class="mt-4 d-none" data-coding-panel>
                        <div class="app-card app-card-muted p-3 mb-3">
                            <div class="fw-semibold">Problem</div>
                            <p class="mb-2" data-coding-prompt></p>
                            <div class="small text-muted" data-coding-constraints></div>
                        </div>
                        <div class="app-card app-card-muted p-3 mb-3">
                            <div class="fw-semibold">Examples</div>
                            <div class="small" data-coding-examples></div>
                        </div>
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                            <div class="fw-semibold">Code Editor</div>
                            <select class="form-select form-select-sm" style="max-width: 180px;" id="codeLanguage">
                                <option value="javascript">JavaScript</option>
                                <option value="python">Python</option>
                                <option value="cpp">C++</option>
                            </select>
                        </div>
                        <textarea class="form-control app-mono" id="codeEditor" rows="10"></textarea>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <button class="btn btn-outline-dark" id="runCode">Run</button>
                            <button class="btn btn-dark" id="submitCode">Submit</button>
                        </div>
                        <div class="app-card app-card-muted p-3 mt-3">
                            <div class="fw-semibold">Output</div>
                            <pre class="mb-0 app-mono" id="codeOutput">Ready.</pre>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div class="auto-save-indicator" data-auto-save>
                        <span class="auto-save-dot" data-auto-save-dot></span>
                        <span>Auto-save idle</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-dark" data-prev-question>Previous</button>
                        <button class="btn btn-outline-dark" data-flag>Flag</button>
                        <button class="btn btn-dark" data-next-question>Next</button>
                        <button class="btn btn-dark" data-submit-exam>Submit</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/exam.js"></script>
</body>
</html>
