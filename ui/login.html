<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Secure Exam Login</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/accessibility.css" />
    <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="app-bg app-fullscreen">
    <header class="app-header">
        <div class="container-fluid py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="status-icon is-ok">
                    <span class="material-symbols-outlined">lock</span>
                </div>
                <div>
                    <div class="app-title">Secure Exam Browser</div>
                    <div class="app-subtitle">Sign in to begin your session</div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="status-pill-warn" id="dbStatus">DB Checking</span>
            </div>
        </div>
    </header>

    <main class="container app-main app-compact">
        <div class="auth-grid">
            <section class="app-card p-4 auth-hero fade-up">
                <div class="card-header">
                    <div>
                        <div class="card-title">Welcome back</div>
                        <div class="card-subtitle">Start your exam flow in seconds.</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="auth-steps">
                        <div class="auth-step">1. Sign in with your credentials</div>
                        <div class="auth-step">2. Confirm system readiness</div>
                        <div class="auth-step">3. Complete verification</div>
                    </div>
                </div>
            </section>

            <section class="app-card p-4 auth-card fade-up stagger-1">
                <div class="card-header">
                    <div>
                        <div class="card-title">Candidate Login</div>
                        <div class="card-subtitle">Enter your credentials to continue.</div>
                    </div>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" id="username" type="text" autocomplete="username" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" type="password" autocomplete="current-password" required />
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-dark" type="submit" id="loginButton">Sign In</button>
                            <button class="btn btn-light" type="button" id="focusUsername">Edit username</button>
                        </div>
                    </form>

                    <div class="mt-3 text-danger small" id="loginError" style="display: none;"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
