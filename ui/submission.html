<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Final Submission Review - Secure Exam Browser</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/accessibility.css" />
    <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="app-bg app-fullscreen">
    <header class="app-header">
        <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div>
                <div class="app-title">Final Review</div>
                <div class="app-subtitle">Verify answers before final submission</div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="app-mono small">Candidate</div>
                <div id="studentName" class="fw-semibold">Student Name</div>
            </div>
        </div>
    </header>

    <main class="container app-main app-compact">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="app-card p-4 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="status-icon">
                            <span class="material-symbols-outlined">timer</span>
                        </div>
                        <div>
                            <div class="text-muted small">Time Remaining</div>
                            <div class="app-mono fs-4 fw-semibold" data-timer-display>00:00:00</div>
                        </div>
                    </div>
                </div>

                <div class="app-card p-4">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h2 class="app-section-title mb-0">Question Status</h2>
                        <button class="btn btn-outline-dark" onclick="returnToExam()">Return to Exam</button>
                    </div>
                    <div class="row g-2" data-submission-grid></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="app-card p-4 mb-4">
                    <div class="position-relative d-flex justify-content-center">
                        <div class="radial-meter" data-radial-meter></div>
                        <div class="radial-meter-content">
                            <div class="fs-1 fw-bold" data-radial-value>0%</div>
                            <div class="text-muted small">Completion</div>
                        </div>
                    </div>
                </div>
                <div class="app-card p-4 mb-4" data-metric="answered">
                    <div class="text-muted small">Answered</div>
                    <div class="d-flex align-items-baseline gap-2">
                        <div class="app-mono fs-4 fw-semibold" data-metric-value>0</div>
                        <div class="text-muted" data-metric-total>/ 0</div>
                    </div>
                </div>
                <div class="app-card p-4 mb-4" data-metric="unanswered">
                    <div class="text-muted small">Unanswered</div>
                    <div class="d-flex align-items-baseline gap-2">
                        <div class="app-mono fs-4 fw-semibold" data-metric-value>0</div>
                        <div class="text-muted" data-metric-total>/ 0</div>
                    </div>
                </div>
                <div class="app-card p-4" data-metric="flagged">
                    <div class="text-muted small">Flagged</div>
                    <div class="d-flex align-items-baseline gap-2">
                        <div class="app-mono fs-4 fw-semibold" data-metric-value>0</div>
                        <div class="text-muted" data-metric-total>/ 0</div>
                    </div>
                </div>
                <button class="btn btn-dark w-100 mt-4" onclick="confirmSubmission()" data-submit-button>
                    Confirm Submission
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/submission.js"></script>
</body>
</html>
